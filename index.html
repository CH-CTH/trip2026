<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛杉磯 · 優勝美地 · 舊金山 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f6f1;
  --surface: #ffffff;
  --border: #e8e3d8;
  --text: #1c1916;
  --muted: #928c82;
  --accent: #1e4d7b;
  --accent-bg: #eaf1f8;
  --gold: #9a6e00;
  --gold-bg: #fdf7e8;
  --green: #2d5a2d;
  --green-bg: #edf5ed;
  --red: #7a1f1f;
  --red-bg: #fdf0f0;
  --pink: #6b2545;
  --pink-bg: #fdf0f5;
  --purple: #4a2d7a;
  --purple-bg: #f2eeff;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --r: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── HERO ── */
.hero {
  background: var(--text);
  color: #fff;
  padding: 56px 24px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 40px,
    rgba(255,255,255,0.015) 40px,
    rgba(255,255,255,0.015) 80px
  );
  pointer-events: none;
}
.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
  margin-bottom: 16px;
}
.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(30px, 7vw, 58px);
  font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1.15;
  margin-bottom: 14px;
}
.hero h1 em {
  font-style: italic;
  font-weight: 400;
  color: rgba(255,255,255,0.7);
}
.hero-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.08em;
}
.hero-pills {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 24px;
}
.hero-pill {
  font-size: 11px;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.04em;
}

/* ── NAV TABS ── */
.nav-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: var(--shadow-sm);
}
.nav-inner {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  max-width: 960px;
  margin: 0 auto;
  padding: 0 8px;
}
.nav-inner::-webkit-scrollbar { display: none; }
.nav-tab {
  flex-shrink: 0;
  padding: 14px 16px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  text-align: center;
  white-space: nowrap;
  line-height: 1;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.nav-tab-sub {
  display: block;
  font-size: 9px;
  font-weight: 300;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: 0.04em;
}

/* ── LAYOUT ── */
.page { display: none; }
.page.active { display: block; }
.container { max-width: 960px; margin: 0 auto; padding: 32px 16px 80px; }

/* ── DAY HEADER ── */
.day-hero {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.day-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 64px;
  font-weight: 600;
  line-height: 1;
  flex-shrink: 0;
  width: 72px;
  text-align: center;
}
.day-info { flex: 1; padding-top: 6px; }
.day-date { font-size: 20px; font-weight: 500; line-height: 1.3; }
.day-theme { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
.day-core {
  font-size: 12px;
  color: var(--accent);
  margin-top: 10px;
  font-style: italic;
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  line-height: 1.5;
}

/* ── TIMELINE ── */
.timeline { position: relative; }
.timeline::before {
  content: '';
  position: absolute;
  left: 54px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}

.event {
  display: flex;
  gap: 0;
  margin-bottom: 4px;
  position: relative;
}
.event-time {
  width: 54px;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding-top: 18px;
  text-align: right;
  padding-right: 14px;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.event-dot-wrap {
  width: 16px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 20px;
  position: relative;
  z-index: 1;
}
.event-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 2px solid var(--surface);
  flex-shrink: 0;
}
.event-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px 12px;
  margin-left: 12px;
  margin-bottom: 8px;
  transition: box-shadow 0.2s, transform 0.2s;
}
.event-card:hover {
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}
.event-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
}
.event-detail {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
  line-height: 1.7;
}
.event-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}
.tag {
  font-size: 10px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 10px;
  letter-spacing: 0.02em;
}
.tag-drive { background: var(--accent-bg); color: var(--accent); }
.tag-food  { background: var(--gold-bg);   color: var(--gold); }
.tag-shop  { background: var(--pink-bg);   color: var(--pink); }
.tag-park  { background: var(--green-bg);  color: var(--green); }
.tag-hotel { background: var(--purple-bg); color: var(--purple); }
.tag-warn  { background: var(--red-bg);    color: var(--red); }
.tag-tip   { background: var(--green-bg);  color: var(--green); }
.tag-default { background: var(--bg); color: var(--muted); }

/* ── SECTION DIVIDER ── */
.sec-div {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 36px 0 20px;
}
.sec-div-line { flex: 1; height: 1px; background: var(--border); }
.sec-div-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 5px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
}

/* ── HOTELS ── */
.hotels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 14px;
}
.hotel-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.hotel-head {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.hotel-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 600;
  flex-shrink: 0;
}
.hotel-name { font-size: 14px; font-weight: 500; line-height: 1.4; }
.hotel-dates { font-size: 11px; color: var(--muted); margin-top: 3px; }
.hotel-body { padding: 12px 16px; }
.hotel-addr { font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 10px; }
.hotel-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.hotel-row:last-of-type { border-bottom: none; }
.hotel-row .lbl { color: var(--muted); flex-shrink: 0; }
.hotel-row .val { font-weight: 500; text-align: right; }
.hotel-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.hotel-conf {
  font-size: 10px;
  color: var(--muted);
  margin-top: 8px;
  font-family: monospace;
  background: var(--bg);
  padding: 6px 10px;
  border-radius: 8px;
  word-break: break-all;
  line-height: 1.6;
}

/* ── CANCEL TABLE ── */
.cancel-wrap { overflow-x: auto; margin-top: 16px; }
.cancel-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 360px;
}
.cancel-table th {
  text-align: left;
  padding: 11px 14px;
  background: var(--text);
  color: #fff;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.04em;
}
.cancel-table th:first-child { border-radius: 8px 0 0 0; }
.cancel-table th:last-child { border-radius: 0 8px 0 0; }
.cancel-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.cancel-table tr:last-child td { border-bottom: none; }
.ok { color: var(--green); font-weight: 500; }
.no { color: var(--red); font-weight: 500; }

/* ── CHECKLIST ── */
.checklist-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.5;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.check-item:hover { box-shadow: var(--shadow-sm); }
.check-item.done { opacity: 0.5; }
.check-item.done span { text-decoration: line-through; }
.check-box {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  transition: all 0.2s;
  background: var(--bg);
}
.check-item.done .check-box {
  background: var(--green);
  border-color: var(--green);
}
.check-item.done .check-box::after {
  content: '';
  display: block;
  width: 5px;
  height: 9px;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(45deg) translate(-1px, -1px);
}
.checklist-note {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 14px;
  font-style: italic;
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .hero { padding: 40px 20px 36px; }
  .day-hero { flex-direction: column; gap: 10px; }
  .day-num { font-size: 48px; width: auto; }
  .timeline::before { left: 44px; }
  .event-time { width: 44px; font-size: 10px; }
  .hotels-grid { grid-template-columns: 1fr; }
  .checklist-grid { grid-template-columns: 1fr; }
}
</style>
</head>

let active = 0;

function tagHtml(tags) {
  if (!tags || !tags.length) return '';
  return '<div class="event-tags">' + tags.map(t =>
    `<span class="tag tag-${t.type||'default'}">${t.text}</span>`
  ).join('') + '</div>';
}

function renderDayPage(day, idx) {
  return `
<div class="page${idx===0?' active':''}" data-idx="${idx}">
<div class="container">
  <div class="day-hero">
    <div class="day-num" style="color:${day.color}">D${day.id}</div>
    <div class="day-info">
      <div class="day-date">${day.date} &nbsp;·&nbsp; ${day.title}</div>
      <div class="day-theme">${day.theme}</div>
      <div class="day-core">${day.core}</div>
    </div>
  </div>
  <div class="timeline">
    ${day.events.map(e => `
    <div class="event">
      <div class="event-time">${e.time}</div>
      <div class="event-dot-wrap">
        <div class="event-dot" style="background:${day.color}"></div>
      </div>
      <div class="event-card">
        <div class="event-title">${e.title}</div>
        ${e.detail ? `<div class="event-detail">${e.detail}</div>` : ''}
        ${tagHtml(e.tags)}
      </div>
    </div>`).join('')}
  </div>
</div>
</div>`;
}

    </div>`).join('');
  return `
<div class="page" data-idx="${DAYS.length+1}">
<div class="container">
  <div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">出發前必備清單</div><div class="sec-div-line"></div></div>
  <div class="checklist-grid" id="checklistGrid">${items}</div>
  <div class="checklist-note">勾選後自動儲存在此瀏覽器中</div>
</div>
</div>`;
}

function buildNav() {
  const nav = document.getElementById('navInner');
  const tabs = [
    ...DAYS.map((d,i) => `<div class="nav-tab${i===0?' active':''}" data-idx="${i}" onclick="switchTab(${i})">Day ${d.id}<span class="nav-tab-sub">${d.date.split(' ')[0]}</span></div>`),
    `<div class="nav-tab" data-idx="${DAYS.length}" onclick="switchTab(${DAYS.length})">🏨 住宿<span class="nav-tab-sub">訂房資訊</span></div>`,
    `<div class="nav-tab" data-idx="${DAYS.length+1}" onclick="switchTab(${DAYS.length+1})">✅ 清單<span class="nav-tab-sub">出發前</span></div>`,
  ];
  nav.innerHTML = tabs.join('');
}

function buildPages() {
  const pages = document.getElementById('pages');
  pages.innerHTML = DAYS.map((d,i) => renderDayPage(d,i)).join('') + renderHotelPage() + renderCheckPage();
}

function switchTab(idx) {
  active = idx;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector(`.page[data-idx="${idx}"]`).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.nav-tab[data-idx="${idx}"]`).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleCheck(i) {
  const checks = JSON.parse(localStorage.getItem(CHECKS_KEY)||'{}');
  checks[i] = !checks[i];
  localStorage.setItem(CHECKS_KEY, JSON.stringify(checks));
  const grid = document.getElementById('checklistGrid');
  if (!grid) return;
  const items = grid.querySelectorAll('.check-item');
  if (items[i]) items[i].classList.toggle('done', !!checks[i]);
}

buildNav();
buildPages();
</script>
</body>
</html>
