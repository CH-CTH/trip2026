<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛杉磯 · 優勝美地 · 舊金山 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6f1;--surface:#fff;--border:#e8e3d8;--text:#1c1916;--muted:#6e685f;--accent:#1e4d7b;--accent-bg:#eaf1f8;--gold:#9a6e00;--gold-bg:#fdf7e8;--green:#2d5a2d;--green-bg:#edf5ed;--red:#7a1f1f;--red-bg:#fdf0f0;--pink:#6b2545;--pink-bg:#fdf0f5;--purple:#4a2d7a;--purple-bg:#f2eeff;--route-bg:#f3f1ec;--r:12px;--r-sm:8px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hero{background:var(--text);color:#fff;padding:48px 24px 40px;text-align:center}
.hero-eyebrow{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.4);margin-bottom:14px}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,6vw,52px);font-weight:600;letter-spacing:.04em;line-height:1.15;margin-bottom:12px}
.hero h1 em{font-style:italic;font-weight:400;color:rgba(255,255,255,.65)}
.hero-sub{font-size:13px;color:rgba(255,255,255,.5);letter-spacing:.07em}
.hero-pills{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:20px}
.hero-pill{font-size:11px;padding:4px 13px;border-radius:20px;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.7)}
.nav-wrap{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav-inner{display:flex;overflow-x:auto;scrollbar-width:none;max-width:960px;margin:0 auto;padding:0 8px}
.nav-inner::-webkit-scrollbar{display:none}
.nav-tab{flex-shrink:0;padding:13px 15px 11px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-align:center;white-space:nowrap;line-height:1}
.nav-tab:hover{color:var(--text)}.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-tab-sub{display:block;font-size:9px;font-weight:300;color:var(--muted);margin-top:3px}
.page{display:none}.page.active{display:block}
.container{max-width:860px;margin:0 auto;padding:28px 16px 80px}
.day-hero{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.day-num{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:600;line-height:1;margin-bottom:6px}
.day-date{font-size:20px;font-weight:500}
.day-theme{font-size:14px;color:#3a3530;margin-top:5px;line-height:1.6}
.day-core{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;color:var(--accent);margin-top:8px;line-height:1.5}
.sec-lbl{font-size:10px;font-weight:500;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.meals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:28px}
.meal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px}
.meal-lbl{font-size:10px;font-weight:500;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.meal-name{font-size:15px;font-weight:500;color:#1c1916;line-height:1.4}
.meal-note{font-size:13px;color:#3a3530;margin-top:3px;line-height:1.4}
.meal-empty{font-size:12px;color:#ccc;font-style:italic}
.spots{display:flex;flex-direction:column;gap:4px}
.spot{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;transition:box-shadow .2s}
.spot:hover{box-shadow:0 4px 20px rgba(0,0,0,.08)}
.spot-time{font-size:15px;font-weight:700;color:#1c1916}
.spot-title{font-size:18px;font-weight:500;color:#1c1916;margin-top:3px;line-height:1.4}
.spot-desc{font-size:15px;color:#2a2520;margin-top:6px;line-height:1.75}
.spot-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.route-pill{display:flex;align-items:center;gap:0;padding:3px 0 3px 18px}
.route-arrow{font-size:13px;color:var(--muted);margin-right:10px;flex-shrink:0}
.route-inner{display:inline-flex;align-items:center;gap:8px;background:var(--route-bg);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:14px;color:#3a3530;flex-wrap:wrap}
.rpath{color:var(--text);font-weight:500}.rdot{color:var(--border)}.rwarn{color:var(--red);font-weight:500}
.tag{font-size:12px;font-weight:500;padding:4px 11px;border-radius:10px}
.tag-drive{background:var(--accent-bg);color:var(--accent)}.tag-food{background:var(--gold-bg);color:var(--gold)}
.tag-shop{background:var(--pink-bg);color:var(--pink)}.tag-park{background:var(--green-bg);color:var(--green)}
.tag-hotel{background:var(--purple-bg);color:var(--purple)}.tag-warn{background:var(--red-bg);color:var(--red)}
.tag-tip{background:var(--green-bg);color:var(--green)}.tag-default{background:var(--bg);color:var(--muted)}
.sec-div{display:flex;align-items:center;gap:14px;margin:32px 0 18px}
.sec-div-line{flex:1;height:1px;background:var(--border)}
.sec-div-label{font-size:10px;letter-spacing:.14em;color:var(--muted);padding:5px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);white-space:nowrap}
.hotels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.hotel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.hotel-head{display:flex;gap:12px;align-items:flex-start;padding:15px 16px 12px;border-bottom:1px solid var(--border)}
.hotel-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;flex-shrink:0}
.hotel-name{font-size:14px;font-weight:500;line-height:1.4}.hotel-dates{font-size:11px;color:var(--muted);margin-top:3px}
.hotel-body{padding:12px 16px}.hotel-addr{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:10px}
.hotel-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:14px;border-bottom:1px solid var(--border);gap:12px}
.hotel-row:last-of-type{border-bottom:none}.hotel-row .lbl{color:var(--muted);flex-shrink:0}.hotel-row .val{font-weight:500;text-align:right}
.hotel-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.hotel-conf{font-size:11px;color:var(--muted);margin-top:8px;font-family:monospace;background:var(--bg);padding:6px 10px;border-radius:8px;word-break:break-all;line-height:1.6}
.cancel-wrap{overflow-x:auto;margin-top:16px}
.cancel-table{width:100%;border-collapse:collapse;font-size:13px;min-width:360px}
.cancel-table th{text-align:left;padding:11px 14px;background:var(--text);color:#fff;font-weight:500;font-size:12px}
.cancel-table th:first-child{border-radius:8px 0 0 0}.cancel-table th:last-child{border-radius:0 8px 0 0}
.cancel-table td{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);font-size:14px}
.cancel-table tr:last-child td{border-bottom:none}
.ok{color:var(--green);font-weight:500}.no{color:var(--red);font-weight:500}
.checklist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:14px}
.check-item{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px;font-size:14px;line-height:1.5;cursor:pointer;transition:all .15s;user-select:none}
.check-item.done{opacity:.45}.check-item.done span{text-decoration:line-through}
.check-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--bg)}
.check-item.done .check-box{background:var(--green);border-color:var(--green)}
.check-item.done .check-box::after{content:'';display:block;width:5px;height:9px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg) translate(-1px,-1px)}
.checklist-note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;font-style:italic}
.meal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.meal-header{padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal-header-left{flex:1;min-width:0}
.meal-toggle{font-size:11px;color:var(--muted);flex-shrink:0;transition:transform .2s}
.meal-toggle.open{transform:rotate(180deg)}
.meal-body{display:none;padding:0 13px 12px;border-top:1px solid var(--border)}
.meal-body.open{display:block}
.meal-option{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:#2a2520;line-height:1.65}
.meal-option:last-child{border-bottom:none}
.meal-option-title{font-weight:600;color:var(--text);margin-bottom:3px}
.meal-option-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;margin-right:5px;margin-bottom:3px}
.badge-best{background:#fff8e8;color:#9a6e00}
.badge-alt{background:#edf5ed;color:#2d5a2d}
.rd-toggle{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--route-bg);border:1px solid var(--border);border-radius:20px;font-size:13px;color:var(--muted);cursor:pointer;width:fit-content;margin-top:4px;user-select:none;transition:all .2s}
.rd-toggle:hover{background:#e8e4dc;color:var(--text)}
.rd-toggle .rd-arrow{font-size:10px;transition:transform .25s}
.rd-toggle.open .rd-arrow{transform:rotate(180deg)}
.rd-body{display:none;margin-top:6px}
.rd-body.open{display:block}
@media(max-width:580px){.meals{gap:6px}.meal{padding:9px 10px}.meal-name{font-size:13px}.hotels-grid{grid-template-columns:1fr}.checklist-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-eyebrow">FAMILY ROAD TRIP · 2026</div>
  <h1>洛杉磯 · <em>優勝美地</em> · 舊金山</h1>
  <div class="hero-sub">6月11日 — 6月21日 &nbsp;·&nbsp; 4人同行 &nbsp;·&nbsp; 自駕遊</div>
  <div class="hero-pills">
    <span class="hero-pill">✈ 桃園 → LAX → SFO</span>
    <span class="hero-pill">迪士尼 · 環球影城</span>
    <span class="hero-pill">優勝美地國家公園</span>
    <span class="hero-pill">10天 · 9晚 · 6間飯店</span>
  </div>
</header>
<nav class="nav-wrap"><div class="nav-inner" id="navInner"></div></nav>
<div id="pages"></div>
<script>
const CK='lasf2026_checks';
function rp(path,time,warn){if(!path)return'';let i=`<span class="rpath">${path}</span>`;if(time)i+=`<span class="rdot">·</span><span>${time}</span>`;if(warn)i+=`<span class="rdot">·</span><span class="rwarn">${warn}</span>`;return`<div class="route-pill"><span class="route-arrow">↓</span><div class="route-inner">${i}</div></div>`}
function th(tags){if(!tags||!tags.length)return'';return'<div class="spot-tags">'+tags.map(t=>`<span class="tag tag-${t.type||'default'}">${t.text}</span>`).join('')+'</div>'}
let rdIdx=0;
function sc(s){
  const idx=rdIdx++;
  const rentalToggle=s.rental?`<div class="rd-toggle" onclick="toggleRd('rental${idx}',this)"><span class="rd-arrow">▼</span> 租車中心 + 路線說明</div><div class="rd-body" id="rental${idx}">${s.rental}</div>`:'';
  const rd=s.routeDetail?`<div class="rd-toggle" onclick="toggleRd('route${idx}',this)"><span class="rd-arrow">▼</span> 詳細路線說明</div><div class="rd-body" id="route${idx}">${s.routeDetail}</div>`:'';
  const photoDiv=`<div class="spot-photo-container" data-title="${s.title}" style="display:none;"></div>`;
  return`<div class="spot"><div class="spot-time">${s.time}</div><div class="spot-title">${s.title}</div>${photoDiv}${s.desc?`<div class="spot-desc">${s.desc}</div>`:''} ${th(s.tags)}${s.extra||''}</div>${rentalToggle}${s.route?rp(s.route.path,s.route.time,s.route.warn):''}${rd}`;
}

function toggleRd(id,btn){
  const body=document.getElementById(id);
  if(!body)return;
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  btn.classList.toggle('open',!isOpen);
}

function mc(lbl,m,midx){
  if(!m){return '<div class="meal"><div class="meal-header" style="cursor:default"><div class="meal-header-left"><div class="meal-lbl">'+lbl+'</div><div class="meal-empty">尚未安排</div></div></div></div>';}
  var hasBody=m.options&&m.options.length>0;
  var bodyId='meal_'+midx+'_'+lbl;
  var optHtml='';
  if(hasBody){optHtml=m.options.map(function(o){
    var badge='<span class="meal-option-badge '+(o.best?'badge-best':'badge-alt')+'">'+(o.best?'🏆 首選':'💡 備選')+'</span>';
    var desc=o.desc?'<div style="margin-top:3px;color:#3a3530">'+o.desc+'</div>':'';
    var link=o.url?'<a href="'+o.url+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;margin-top:6px;margin-right:8px;font-size:12px;color:#1e4d7b;font-weight:500;text-decoration:none;">🔗 餐廳網頁</a>':'';
    var link2=o.url2?'<a href="'+o.url2+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;color:#2d5a2d;font-weight:500;text-decoration:none;">🔗 Sidecar Doughnuts</a>':'';
    return '<div class="meal-option"><div class="meal-option-title">'+badge+o.name+'</div>'+desc+link+link2+'</div>';
  }).join('');}
  var rootLink=(!hasBody&&m.url)?'<a href="'+m.url+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;color:#1e4d7b;font-weight:500;text-decoration:none;">🔗 餐廳網頁</a>':'';
  var note=m.note?'<div class="meal-note">'+m.note+'</div>':'';
  var toggle=hasBody?'<span class="meal-toggle">&#9660;</span>':'';
  var body=hasBody?'<div class="meal-body" id="'+bodyId+'">'+optHtml+'</div>':'';
  var cursorStyle=hasBody?'':'cursor:default';
  var onclickAttr=hasBody?'onclick="toggleMeal(decodeURIComponent(this.dataset.bid),this)" data-bid="'+encodeURIComponent(bodyId)+'"':'';
  return '<div class="meal"><div class="meal-header" '+onclickAttr+' style="'+cursorStyle+'"><div class="meal-header-left"><div class="meal-lbl">'+lbl+'</div><div class="meal-name">'+m.name+'</div>'+note+rootLink+'</div>'+toggle+'</div>'+body+'</div>';
}
function toggleMeal(id,btn){
  const body=document.getElementById(id);
  if(!body)return;
  const open=body.classList.toggle('open');
  btn.querySelector('.meal-toggle').classList.toggle('open',open);
}
let mhIdx=0;function mh(b,l,d){const i=mhIdx++;return`<div class="meals">${mc('早餐',b,i+'b')}${mc('午餐',l,i+'l')}${mc('晚餐',d,i+'d')}</div>`}

const DAYS=[
{id:1,date:'6/11 (四)',title:'西岸初見面',color:'#1e4d7b',
theme:'LAX 落地 → 聖塔莫尼卡 → 蓋蒂中心 → Pasadena',
core:'機場出發 → 陽光海灘 → 山頂夕陽 → 入住老城區',
meals:{b:{"name": "Great White / Blue Plate Taco", "options": [{"name": "Great White", "desc": "【澳洲風早午餐】洛杉磯超紅的沿海餐飲，酪梨吐司與鮮魚塔可非常出名。", "best": true, "url": "https://greatwhite.cafe"}, {"name": "Blue Plate Taco", "desc": "【海景墨西哥菜】位於 Santa Monica 海濱，龍蝦塔可與調酒配海景極棒。", "best": false, "url": "https://blueplatetaco.com"}]},l:{"name": "In-N-Out Burger (LAX 朝聖店)", "note": "坐在草地上看飛機低空掠過降落。必點：Double-Double、Animal Style Fries。", "url": "https://in-n-out.com", "desc": "【加州漢堡靈魂】9149 S Sepulveda Blvd 這間分店是看飛機降落的聖地。必點：Double-Double、Animal Style Fries。"},d:{"name": "Union Restaurant", "note": "義大利麵、義式開胃菜。有儀式感的義式料理。⚠️ 需提前訂位。", "options": [{"name": "Union Restaurant", "desc": "【北義料理】Pasadena 排隊名店，堅持產地到餐桌的義大利麵極有質感。需提前訂位。", "best": true, "url": "https://unionpasadena.com"}, {"name": "Bottega Louie / Sidecar Doughnuts", "desc": "【歐式甜點 + 精品甜甜圈】Bottega Louie：像藝廊一樣的宮廷風裝潢，馬卡龍與法式甜點是送禮首選。Sidecar：標榜世界最厲害的甜甜圈，現炸口感酥脆不油膩。", "url": "https://bottegalouie.com", "url2": "https://sidecardoughnuts.com", "best": false}]}},

{time:'07:20',title:'抵達 LAX 機場',desc:'入境審查 + 領行李 + 租車，預估 1.5–2 小時。建議 09:30 前完成，09:45 最晚上路。',extra:`<div style="display:none"></div>`,tags:[{type:'warn',text:'入境旺季排隊約 60 分鐘'}],route:{path:'I-405 N → I-10 W',time:'約 30–45 分鐘'},rental:` <div style="margin-top:10px;padding:12px 14px;background:#f3f1ec;border-radius:10px;font-size:14px;color:#2a2520;line-height:1.8;">   <div style="font-weight:600;font-size:15px;margin-bottom:8px;color:#1c1916;">🚌 LAX 租車中心步驟</div>   <div style="margin-bottom:6px;"><span style="font-weight:600;">①</span> 出航廈後（抵達層）&nbsp;→&nbsp; 抬頭找<span style="font-weight:600;color:#5b3fa0;">紫色</span>牌子，字樣：<span style="font-weight:600;">Rental Car Shuttles</span></div>   <div style="margin-bottom:6px;"><span style="font-weight:600;">②</span> 過小馬路走到中央島（Median）&nbsp;→&nbsp; 找地面或柱子上的<span style="font-weight:600;color:#5b3fa0;">紫色</span>標示</div>   <div style="margin-bottom:6px;"><span style="font-weight:600;">③</span> 上車&nbsp;→&nbsp; 看到寫 <span style="font-weight:600;">Rental Car Center</span> 的紫色巴士直接上，不分品牌（Hertz、Avis 等全部同一棟樓）</div>   <div><span style="font-weight:600;">④</span> 抵達後搭電梯至櫃檯層，12 家租車公司排排站&nbsp;·&nbsp; <span style="font-weight:600;">車程 10–20 分鐘</span></div> </div> <div style="margin-top:8px;padding:14px 16px;background:#eaf1f8;border-radius:10px;font-size:14px;color:#2a2520;line-height:1.85;border-left:3px solid #1e4d7b;">   <div style="font-weight:600;font-size:15px;margin-bottom:10px;color:#1e4d7b;">🗺️ 租車中心 → Santa Monica 路線（30–45 分鐘）</div>    <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">① 駛出租車中心（2–5 分鐘）</div>     <div>導航設定：<span style="font-weight:600;">Public Parking Structure 4, Santa Monica</span>（入口在 2nd St）</div>     <div>出大樓後順指標走地面道路，盯緊綠色大指標「<span style="font-weight:600;">Freeways</span>」或「<span style="font-weight:600;">I-405 North</span>」即可。</div>   </div>    <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">② 上 I-405 North（10–12 英里，約 15–20 分鐘）</div>     <div>從右側匯入後，待在右邊數來第 2 或第 3 條車道。</div>     <div style="margin-top:4px;color:#7a1f1f;font-weight:500;">✗ 最右邊車道常變 Exit Only &nbsp;·&nbsp; ✗ 最左邊是 Carpool Lane，勿進入</div>   </div>    <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">③ 切換 I-10 West ← 全程最需要專心的地方</div>     <div>開了約 10 英里後，導航和路標會出現「<span style="font-weight:600;">I-10 West / Santa Monica</span>」。</div>     <div>提前 1 英里（1.6 公里）開始向右移道，進入長長的右彎高架引道，順著大彎道即可匯入 10 號公路。</div>     <div style="margin-top:4px;color:#7a1f1f;font-weight:500;">✗ 不要靠到最右邊邊角（那是 I-10 East 出口）</div>   </div>    <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">④ I-10 West 直奔海邊（5–8 分鐘）</div>     <div>10 號公路往西，終點就是太平洋，<span style="font-weight:600;">不可能開過頭</span>。</div>     <div>看到海或市區建築時，導航會指示在 <span style="font-weight:600;">4th St / 5th St 出口</span>下高速。</div>   </div>    <div>     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">⑤ 抵達與停車</div>     <div>下交流道後跟導航走即可。</div>     <div style="margin-top:4px;color:#7a1f1f;font-weight:500;">⚠️ Public Parking Structure 4 入口在 <span style="font-weight:600;">2nd Street</span>，不是 4th Street！開慢一點找。</div>     <div style="margin-top:4px;">取票進場，前 <span style="font-weight:600;">90 分鐘免費</span>，走出來就是 3rd Street Promenade 逛街區。</div>   </div> </div>`},
{time:'10:45',title:'Santa Monica',desc:null,tags:[{type:'shop',text:'逛街'},{type:'tip',text:'女孩必拍'}],
extra:`<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:15px;color:#1c1916;margin-bottom:4px;">① Santa Monica Pier</div>     <div style="font-size:14px;color:#2a2520;line-height:1.7;">太平洋海景・摩天輪・Route 66 終點牌</div>     <div style="font-size:13px;color:#1e4d7b;margin-top:4px;font-weight:500;">📸 摩天輪＋海景 Route 66 經典打卡照 &nbsp;·&nbsp; 停留 45–60 分鐘</div>   </div>   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:15px;color:#1c1916;margin-bottom:4px;">② 海灘走走</div>     <div style="font-size:14px;color:#2a2520;line-height:1.7;">沙灘乾淨・救生塔很好拍・椰子樹超有加州感</div>     <div style="font-size:13px;color:#3a3530;margin-top:4px;">不用走太遠，踩踩沙就好。</div>   </div>   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:15px;color:#1c1916;margin-bottom:4px;">③ 3rd Street Promenade</div>     <div style="font-size:14px;color:#2a2520;line-height:1.7;">Urban Outfitters・Lululemon・Sephora・Apple Store</div>     <div style="font-size:13px;color:#3a3530;margin-top:4px;">第一天逛這裡氣氛超好，不會有市區壓力。</div>     <div style="font-size:13px;color:#6b2545;margin-top:3px;font-weight:500;">停車：Public Parking Structure 4，前 90 分鐘免費，入口在 2nd St</div>   </div> </div>`,
route:{path:'I-10 E → I-405 N',time:'約 25–35 分鐘'},routeDetail:`<div style="margin-top:8px;padding:14px 16px;background:#eaf1f8;border-radius:10px;font-size:14px;color:#2a2520;line-height:1.85;border-left:3px solid #1e4d7b;">   <div style="font-weight:600;font-size:15px;margin-bottom:10px;color:#1e4d7b;">🗺️ Santa Monica → 蓋蒂中心（20–30 分鐘）</div>   <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">① 離開停車場，上 I-10 East</div>     <div>導航設定：<span style="font-weight:600;">The Getty Center</span></div>     <div>從 Parking Structure 4 的 <span style="font-weight:600;">4th Street 出口</span>駛出，沿 4th St 往南開（遠離海邊方向），很快就會看到 <span style="font-weight:600;">I-10 East（往 Los Angeles）</span>入口。進去後穩定車速。</div>   </div>   <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">② I-10 East → I-405 North ← 最重要切換</div>     <div>這段很短，約 3.5 英里（5–7 分鐘），要提早準備。</div>     <div style="margin-top:4px;">導航剩 1 英里時，開始切換到偏右側車道，跟著寫 <span style="font-weight:600;">I-405 North / Sacramento</span> 的綠色標示，順著向右高架彎道匯入即可。</div>     <div style="margin-top:4px;color:#7a1f1f;font-weight:500;">✗ 最右邊那條有時是 I-405 South，注意辨別</div>   </div>   <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">③ I-405 North → Getty Center Dr 出口（5–8 分鐘）</div>     <div>匯入 405 後穩定行駛，看到 <span style="font-weight:600;">"Getty Center Dr"</span> 出口牌即切換到最右側下匝道。</div>     <div style="margin-top:4px;">下匝道後會看到紅綠燈，路口標示非常大，直接跟著 <span style="font-weight:600;">"Getty Center"</span> 專屬指標進入，像進入私人莊園入口一樣。</div>   </div>   <div>     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">④ 停車與搭電車</div>     <div>進入後先過崗哨（工作人員確認預約），停地下停車場（<span style="font-weight:600;">地下 4–5 樓位子較多</span>）。</div>     <div style="margin-top:4px;">停好後搭免費 <span style="font-weight:600;">Tram 電車</span>上山，沿途風景極佳，是女兒們拍照的好機會。</div>   </div> </div>`},
{time:'15:30',title:'蓋蒂中心 (The Getty Center)',desc:'建議預約 16:00 場次（比 15:30 更從容）。',tags:[{type:'tip',text:'建議改預約 16:00 場次'}],
extra:`<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:15px;color:#1c1916;margin-bottom:6px;">① 建築與景觀</div>     <div style="font-size:14px;color:#2a2520;line-height:1.75;">白色石灰華大理石建築，光線柔和，加州最具代表性的現代建築，整座山頭都是網美牆。</div>     <div style="margin-top:8px;display:flex;flex-direction:column;gap:5px;">       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">🚡 免費電車（Tram）</span>：搭電車上山約 10 分鐘，像乘坐未來的雲端列車，女兒們一定會拿手機拍縮時攝影。</div>       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">🏛 露天廣場（Museum Courtyard）</span>：整座建築的中心，有巨大遮陽傘和噴水池。</div>       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">🛣 405 公路觀景台</span>：俯瞰剛才困住你們的 405 號高速公路，密密麻麻的車流在腳下，這才是真正的「洛杉磯視角」。</div>     </div>   </div>   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:15px;color:#1c1916;margin-bottom:6px;">② 戶外花園：Central Garden</div>     <div style="font-size:14px;color:#2a2520;line-height:1.7;">由藝術家 Robert Irwin 設計，是蓋蒂中心的靈魂。</div>     <div style="margin-top:8px;display:flex;flex-direction:column;gap:5px;">       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">💧 水景迷宮</span>：花園中心是圓形杜鵑花迷宮，漂浮在水池上。</div>       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">📸 拍照角度</span>：從上方步道往下拍花園全景，或走進花園拍看起來像巨型植物的鋼鐵架。</div>       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">🌵 仙人掌花園（South Promontory）</span>：最南端，種滿造型奇特的仙人掌，背景是洛杉磯地平線，風格簡約時髦。</div>     </div>   </div>   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:15px;color:#1c1916;margin-bottom:6px;">③ 必看藝術品</div>     <div style="margin-top:4px;display:flex;flex-direction:column;gap:5px;">       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">🌸 梵谷《鳶尾花》</span>：鎮館之寶，West Pavilion 204 展廳。</div>       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">🎨 印象派畫作</span>：同區有莫內（Monet）和雷諾瓦（Renoir）的作品。</div>       <div style="font-size:14px;color:#2a2520;line-height:1.7;"><span style="font-weight:600;">👑 法式裝飾藝術</span>：North Pavilion，18 世紀法式宮廷傢俱，喜歡凡爾賽宮風格的女兒們會愛。</div>     </div>   </div>   <div style="background:#fff8e8;border-radius:10px;padding:12px 14px;border:1px solid #e8d8a0;border-left:3px solid #9a6e00;">     <div style="font-weight:600;font-size:15px;color:#9a6e00;margin-bottom:6px;">④ 重頭戲：West Pavilion 夕陽 🌅</div>     <div style="font-size:14px;color:#2a2520;line-height:1.75;">蓋蒂中心位於高處，西邊完全沒有遮蔽物。當太陽落入太平洋時，整座白色大理石建築會被染成橘金色。</div>     <div style="margin-top:6px;font-size:14px;color:#2a2520;"><span style="font-weight:600;">📍 位置</span>：West Pavilion 二樓戶外露台，一邊吹海風一邊看落日。</div>   </div> </div>`,
route:{path:'I-405 N → US-101 S → CA-134 E → I-210 E',time:'約 45–55 分鐘',warn:'注意 101 方向，勿走 101 N'},
routeDetail:`<div style="margin-top:8px;padding:14px 16px;background:#eaf1f8;border-radius:10px;font-size:14px;color:#2a2520;line-height:1.85;border-left:3px solid #1e4d7b;">   <div style="font-weight:600;font-size:15px;margin-bottom:10px;color:#1e4d7b;">🗺️ Getty Center → Courtyard Pasadena（45–55 分鐘）</div>    <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">① 離開 Getty，上 I-405 North</div>     <div>離開停車場下山到 405 匝道這段通常會小塞排隊，保持耐心順著排，不要急著切車道。</div>     <div style="margin-top:4px;">進入 <span style="font-weight:600;">I-405 North（往北，離開海邊方向）</span>。</div>   </div>    <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">② I-405 North → US-101 South（7–9 英里，約 10–15 分鐘）</div>     <div>晚上車多是正常的，開了 10 分鐘還沒看到 101 指標請保持冷靜，它就在不遠處。</div>     <div style="margin-top:4px;">看到 <span style="font-weight:600;">"US-101 South / Los Angeles"</span> 指標後向右切換。</div>     <div style="margin-top:4px;color:#2d5a2d;font-weight:500;">✓ 雖然寫 South，但這段實際往「東」開，這是對的。</div>   </div>    <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">③ US-101 → CA-134 East ← 全段大魔王</div>     <div>來到 101 與 134 的大分叉路口：<span style="font-weight:600;">左側 3 條車道往 134 East（Pasadena），右側 2 條往 101 South</span>。</div>     <div style="margin-top:4px;">請待在「<span style="font-weight:600;">左邊數來第 2 或第 3 條車道</span>」，跟著 <span style="font-weight:600;">CA-134 East / Pasadena</span> 指標走。</div>     <div style="margin-top:4px;color:#7a1f1f;font-weight:500;">⚠️ 最左邊第一條是 Carpool Lane，雖然 4 人可以開，但分叉路口建議待在一般車道左側，以免被黃實線困住切不出來。</div>   </div>    <div style="margin-bottom:10px;">     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">④ CA-134 → I-210 East</div>     <div>134 公路開到底會銜接 210 公路，務必看清楚指標 <span style="font-weight:600;">"I-210 East / Pasadena"</span>。</div>     <div style="margin-top:4px;color:#7a1f1f;font-weight:500;">✗ 不要走錯往 West 了。</div>   </div>    <div>     <div style="font-weight:600;color:#1c1916;margin-bottom:4px;">⑤ 下 Fair Oaks 出口 → 抵達飯店</div>     <div>看到 <span style="font-weight:600;">"Fair Oaks Ave"</span> 出口直接下來，下匝道後走平面道路，非常直且好走，直接導引抵達 Courtyard by Marriott Pasadena/Old Town。</div>     <div style="margin-top:4px;color:#2d5a2d;font-weight:500;">✓ 抵達後先在門口暫停卸行李，讓家人先進大廳，你再去停車。</div>   </div> </div>`},

{time:'10:15',title:'Target Anaheim 採買',desc:'101 S Euclid St。採買：24 瓶裝水、防曬乳、能量棒、止痛藥、OK 繃。',tags:[{type:'shop',text:'戰略採買'}],
extra:`<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:14px;color:#1c1916;margin-bottom:8px;">📍 Target 是什麼？</div>     <div style="font-size:14px;color:#2a2520;line-height:1.75;">美國大型平價生活百貨，類似升級版大潤發＋康是美＋家樂福。</div>     <div style="margin-top:10px;font-weight:600;font-size:14px;color:#1c1916;margin-bottom:6px;">推薦區域與必買</div>     <ul style="padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#2a2520;">       <li><span style="font-weight:600;">Snack 零食區：</span>買 Granola Bars（燕麥棒）很好帶進園區充飢。</li>       <li><span style="font-weight:600;">防曬區：</span>推薦 Neutrogena、Banana Boat。</li>       <li><span style="font-weight:600;">冷藏飲料區：</span>為了保冷，記得「拿最後」。可以買小瓶水，比較好帶進園區的小包包裡。</li>     </ul>     <div style="margin-top:10px;font-weight:600;font-size:14px;color:#1c1916;margin-bottom:6px;">小技巧</div>     <ul style="padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#2a2520;">       <li>用自助結帳（Self Checkout）會快很多。</li>       <li>可以順便買隔天早餐（Bagel + 奶油）。</li>     </ul>     <div style="margin-top:8px;font-size:13px;color:#1e4d7b;font-weight:500;">⏱ 建議停留：45–60 分鐘</div>   </div> </div>`,route:{path:'Euclid St N → Lincoln Ave E → Anaheim Blvd',time:'約 8 分鐘'},
routeDetail:`<div style="padding:14px 16px;background:#eaf1f8;border-radius:10px;font-size:14px;color:#2a2520;line-height:1.85;border-left:3px solid #1e4d7b;">   <div style="font-weight:600;font-size:15px;margin-bottom:12px;color:#1e4d7b;">🚗 Target → Anaheim Packing District（11:30，約 8 分鐘）</div>   <div style="margin-bottom:10px;">📍 Google Map 導航設定：<span style="font-weight:600;font-style:italic;">Anaheim Packing District</span></div>   <ul style="padding-left:18px;display:flex;flex-direction:column;gap:4px;"><li style="margin-bottom:6px;">從 Target 停車場出來。</li><li style="margin-bottom:6px;">沿著 <strong>Euclid St 往北</strong>開，右轉進入 <strong>Lincoln Ave 往東</strong>，接著右轉進入 <strong>Anaheim Blvd</strong>。</li><li style="margin-bottom:6px;">車程僅約 8 分鐘。建築物後方有免費停車場，若滿位可至周邊代客泊車或特約空地。</li></ul> </div>`},
{time:'11:30',title:'Anaheim Packing District 逛市集',desc:'由 1919 年柑橘包裝廠改建的文青美食市集（Food Hall），室內充滿陽光、綠色植物與木質裝潢。',tags:[{type:'shop',text:'打卡市集'}],
extra:`<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:14px;color:#1c1916;margin-bottom:8px;">推薦店家</div>     <ul style="padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#2a2520;">       <li><span style="font-weight:600;">Mini Monster：</span>超好拍的漸層珍奶，可加購超可愛的燈泡玻璃瓶或巨無霸棉花糖。</li>       <li><span style="font-weight:600;">The Kroft：</span>必吃起司肉醬薯條（Poutine）。</li>       <li><span style="font-weight:600;">Georgia's Southern Kitchen：</span>道地的美式南方炸雞。</li>       <li><span style="font-weight:600;">Hans' Homemade Ice Cream：</span>手工濃郁冰淇淋。</li>       <li><span style="font-weight:600;">Popbar：</span>義式冰淇淋冰棒店，可自己挑選口味並裹上配料。</li>     </ul>     <div style="margin-top:10px;font-weight:600;font-size:14px;color:#1c1916;margin-bottom:6px;">📸 拍照點</div>     <div style="font-size:14px;color:#2a2520;line-height:1.75;">中央挑高玻璃天窗、二樓吊椅區、室內綠植裝置，以及坐在市集正中央的木製大階梯上用餐兼拍照。</div>     <div style="margin-top:8px;font-size:13px;color:#1e4d7b;font-weight:500;">⏱ 建議停留：1.5–2 小時</div>   </div> </div>`,route:{path:'Anaheim Blvd S → Ball Rd W → Disneyland Dr',time:'約 5–8 分鐘'},
routeDetail:`<div style="padding:14px 16px;background:#eaf1f8;border-radius:10px;font-size:14px;color:#2a2520;line-height:1.85;border-left:3px solid #1e4d7b;">   <div style="font-weight:600;font-size:15px;margin-bottom:12px;color:#1e4d7b;">🚗 Packing District → Disneyland Hotel（15:30，約 5–8 分鐘）</div>   <div style="margin-bottom:10px;">📍 Google Map 導航設定：<span style="font-weight:600;font-style:italic;">Disneyland Hotel</span></div>   <ul style="padding-left:18px;display:flex;flex-direction:column;gap:4px;"><li style="margin-bottom:6px;">從 <strong>Anaheim Blvd 往南</strong>開。</li><li style="margin-bottom:6px;">右轉進入 <strong>Ball Rd 往西</strong>直行。</li><li style="margin-bottom:6px;">看到 <strong>Disneyland Dr 左轉</strong>，順著標示開入飯店房客專屬車道。</li><li style="margin-bottom:6px;"><span style="color:#2d5a2d;font-weight:500;">✅ 先在大門口卸下家人與所有採買物資（特別是 24 瓶水），再去停飯店停車場。</span></li></ul> </div>`},
{time:'15:30',title:'入住 Disneyland Hotel',desc:'Check-in 後將 Target 飲料放進冰箱。16:30 享用 Monorail Pool 泳池（單軌列車滑水道）。',tags:[{type:'hotel',text:'Disneyland Hotel'}],
extra:`<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:14px;color:#1c1916;margin-bottom:8px;">飯店推薦玩法</div>     <ul style="padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#2a2520;">       <li>體驗 <span style="font-weight:600;">Monorail Pool 滑水道</span>。</li>       <li>大廳有非常珍貴的<span style="font-weight:600;">復古迪士尼照片牆</span>。</li>       <li>晚上走到泳池區拍夜景非常浪漫。</li>     </ul>     <div style="margin-top:10px;font-weight:600;font-size:14px;color:#1c1916;margin-bottom:6px;">Downtown Disney 推薦</div>     <ul style="padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#2a2520;">       <li><span style="font-weight:600;">World of Disney：</span>最大周邊商店，買明天入園要戴的耳環或髮箍。</li>       <li><span style="font-weight:600;">Salt & Straw：</span>來自波特蘭的創意冰淇淋。</li>       <li><span style="font-weight:600;">Earl of Sandwich：</span>快速晚餐的絕佳選擇。</li>     </ul>   </div> </div>`,route:null},
{time:'18:30',title:'Downtown Disney 晚餐 + 逛街',desc:'在 World of Disney 買明天入園要戴的耳環或髮箍。',tags:[{type:'shop',text:'Disney 周邊'}],route:null},
]},

{time:'11:00',title:'Citadel Outlets 購物',desc:'洛杉磯唯一市區內 Outlet，外觀是亞述帝國風格城堡。停在靠近 Nike/Adidas 區域，戰利品放後車廂並上鎖，勿反覆開關後車廂。',tags:[{type:'shop',text:'Outlet 採買'},{type:'warn',text:'行李安全注意'}],
extra:`<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:14px;color:#1c1916;margin-bottom:8px;">推薦品牌</div>     <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">       <span style="background:#eaf1f8;color:#1e4d7b;font-size:13px;font-weight:500;padding:3px 11px;border-radius:10px;">Nike</span>       <span style="background:#eaf1f8;color:#1e4d7b;font-size:13px;font-weight:500;padding:3px 11px;border-radius:10px;">Adidas</span>       <span style="background:#eaf1f8;color:#1e4d7b;font-size:13px;font-weight:500;padding:3px 11px;border-radius:10px;">Coach</span>       <span style="background:#eaf1f8;color:#1e4d7b;font-size:13px;font-weight:500;padding:3px 11px;border-radius:10px;">Kate Spade</span>       <span style="background:#eaf1f8;color:#1e4d7b;font-size:13px;font-weight:500;padding:3px 11px;border-radius:10px;">Michael Kors</span>       <span style="background:#eaf1f8;color:#1e4d7b;font-size:13px;font-weight:500;padding:3px 11px;border-radius:10px;">Tommy Hilfiger</span>       <span style="background:#eaf1f8;color:#1e4d7b;font-size:13px;font-weight:500;padding:3px 11px;border-radius:10px;">Levi's</span>     </div>     <div style="font-size:14px;color:#2a2520;line-height:1.75;"><span style="font-weight:600;">逛街戰術：</span>先直衝主攻品牌，不要每間都進，控制在 2–2.5 小時。</div>   </div> </div>`,route:{path:'I-5 N → US-101 N → Highland Ave 出口',time:'約 45–60 分鐘'},
routeDetail:`<div style="padding:14px 16px;background:#eaf1f8;border-radius:10px;font-size:14px;color:#2a2520;line-height:1.85;border-left:3px solid #1e4d7b;">   <div style="font-weight:600;font-size:15px;margin-bottom:12px;color:#1e4d7b;">🚗 Citadel Outlets → Ovation Hollywood（14:30，約 45–60 分鐘）</div>   <div style="margin-bottom:10px;">📍 Google Map 導航設定：<span style="font-weight:600;font-style:italic;">Ovation Hollywood Parking</span></div>   <ul style="padding-left:18px;display:flex;flex-direction:column;gap:4px;"><li style="margin-bottom:6px;">回到 <strong>I-5 North</strong> 往北開。</li><li style="margin-bottom:6px;">盯緊指標，直接切換至 <strong>US-101 North</strong>（避開 110 公路）。</li><li style="margin-bottom:6px;">維持在 101 North 中間車道，看到 <strong>Highland Ave 出口</strong>後靠右下匝道。</li><li style="margin-bottom:6px;">下出口後直行進入 Highland Ave，右手邊即是 Ovation 的地下停車場入口。</li><li style="margin-bottom:6px;"><span style="color:#2d5a2d;font-weight:500;">✅ 實戰細節：略過 110 轉 101 的左側出口風險，讓駕駛壓力大幅降低。</span></li></ul> </div>`},
{time:'14:30',title:'星光大道快閃 (Hollywood)',desc:'洛杉磯電影工業核心！停車：Ovation Hollywood（消費可折抵）。打扮成電影人物的合照通常要收費，微笑拒絕即可。',tags:[{type:'warn',text:'打扮人物合照要收費'}],
extra:`<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">   <div style="background:#f8f6f1;border-radius:10px;padding:12px 14px;border:1px solid #e8e3d8;">     <div style="font-weight:600;font-size:14px;color:#1c1916;margin-bottom:8px;">必看點</div>     <ul style="padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#2a2520;">       <li><span style="font-weight:600;">TCL Chinese Theatre（中國劇院）：</span>尋找經典巨星的明星手印，可找哈利波特或漫威演員。</li>       <li><span style="font-weight:600;">Dolby Theatre（杜比劇院）：</span>奧斯卡頒獎場地，走上那標誌性的大樓梯。</li>       <li><span style="font-weight:600;">Ovation Mall 露台：</span>在這裡可直接拍到遠方的 Hollywood Sign。</li>     </ul>     <div style="margin-top:8px;font-size:13px;color:#1e4d7b;font-weight:500;">⏱ 建議停留：60–75 分鐘</div>   </div> </div>`,route:{path:'Highland Ave N → US-101 N → CA-134 E → Angeleno Ave 出口',time:'約 15–20 分鐘'},
routeDetail:`<div style="padding:14px 16px;background:#eaf1f8;border-radius:10px;font-size:14px;color:#2a2520;line-height:1.85;border-left:3px solid #1e4d7b;">   <div style="font-weight:600;font-size:15px;margin-bottom:12px;color:#1e4d7b;">🚗 Ovation Hollywood → Hotel Burbank（16:30，約 15–20 分鐘）</div>   <div style="margin-bottom:10px;">📍 Google Map 導航設定：<span style="font-weight:600;font-style:italic;">Hotel Burbank</span></div>   <ul style="padding-left:18px;display:flex;flex-direction:column;gap:4px;"><li style="margin-bottom:6px;">從停車場出來，沿 <strong>Highland Ave 往北</strong>，銜接 <strong>US-101 North</strong>。</li><li style="margin-bottom:6px;">很快會看到 <strong>CA-134 East（往 Burbank）</strong>出口，靠右匯入。</li><li style="margin-bottom:6px;">下 <strong>Angeleno Ave 或 Olive Ave 出口</strong>，平面道路 5 分鐘抵達飯店。</li></ul> </div>`},

function rdp(day,idx){
  return`<div class="page${idx===0?' active':''}" data-idx="${idx}"><div class="container"><div class="day-hero"><div class="day-num" style="color:${day.color}">D${day.id}</div><div class="day-date">${day.date} · ${day.title}</div><div class="day-theme">${day.theme}</div><div class="day-core">${day.core}</div></div><div class="sec-lbl">餐飲安排</div>${mh(day.meals.b,day.meals.l,day.meals.d)}<div class="sec-lbl">行程</div><div class="spots">${day.spots.map(s=>sc(s)).join('')}</div></div></div>`;
}

function rhp(){
  const tm={tip:'tag-tip',warn:'tag-warn',default:'tag-default',park:'tag-park',hotel:'tag-hotel',food:'tag-food'};
  const cr=[['Hotel Burbank','6/10 前','ok','可退款'],['Tenaya Lodge','6/15 前','ok','可退款'],['Oakdale Best Western','6/16 前','ok','可退款'],['Grand Hyatt SF','6/17 前','ok','可退款'],['Courtyard Pasadena','不可退','no','不可退款'],['Disneyland Hotel','不可退','no','不可退款']];
  const cards=sl=>sl.map(h=>`<div class="hotel-card"><div class="hotel-head"><div class="hotel-icon" style="background:${h.ib};color:${h.ic}">${h.icon}</div><div><div class="hotel-name">${h.name}</div><div class="hotel-dates">${h.dates}</div></div></div><div class="hotel-body">${h.addr?`<div class="hotel-addr">${h.addr}</div>`:''} ${h.rows.map(([l,v])=>`<div class="hotel-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('')}${h.tags.length?`<div class="hotel-tags">${h.tags.map(t=>`<span class="tag ${tm[t.c]||'tag-default'}">${t.t}</span>`).join('')}</div>`:''}<div class="hotel-conf">${h.conf}</div></div></div>`).join('');
  return`<div class="page" data-idx="${DAYS.length}"><div class="container"><div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">洛杉磯</div><div class="sec-div-line"></div></div><div class="hotels-grid">${cards(HOTELS.slice(0,3))}</div><div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">優勝美地</div><div class="sec-div-line"></div></div><div class="hotels-grid">${cards(HOTELS.slice(3,5))}</div><div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">舊金山</div><div class="sec-div-line"></div></div><div class="hotels-grid">${cards(HOTELS.slice(5))}</div><div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">取消期限一覽</div><div class="sec-div-line"></div></div><div class="cancel-wrap"><table class="cancel-table"><thead><tr><th>飯店</th><th>取消期限</th><th>狀態</th></tr></thead><tbody>${cr.map(([n,d,c,s])=>`<tr><td>${n}</td><td class="${c}">${d}</td><td class="${c}">${s}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

function rcp(){
  const ch=JSON.parse(localStorage.getItem(CK)||'{}');
  return`<div class="page" data-idx="${DAYS.length+1}"><div class="container"><div class="sec-div"><div class="sec-div-line"></div><div class="sec-div-label">出發前必備清單</div><div class="sec-div-line"></div></div><div class="checklist-grid" id="clg">${CHECKLIST.map((item,i)=>`<div class="check-item${ch[i]?' done':''}" onclick="tc(${i})"><div class="check-box"></div><span>${item}</span></div>`).join('')}</div><div class="checklist-note">勾選後自動儲存在此瀏覽器中</div></div></div>`;

function loadSpotPhotos() {
  const containers = document.querySelectorAll('.spot-photo-container');
  containers.forEach(container => {
    const title = container.dataset.title;
    const urls = FIXED_PHOTOS[title];
    if (!urls || urls.length === 0) return;
    container.style.display = 'flex';
    container.style.gap = '8px';
    container.style.marginBottom = '8px';
    container.innerHTML = urls.map(url =>
      '<div style="flex:1;min-width:45%;border-radius:8px;overflow:hidden;aspect-ratio:16/9;">' +
      '<img src="' + url + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.parentElement.style.display=\'none\'">' +
      '</div>'
    ).join('');
  });
}

document.getElementById('navInner').innerHTML=[

  `<div class="nav-tab" data-idx="${DAYS.length}" onclick="st(${DAYS.length})">🏨 住宿<span class="nav-tab-sub">訂房資訊</span></div>`,
  `<div class="nav-tab" data-idx="${DAYS.length+1}" onclick="st(${DAYS.length+1})">✅ 清單<span class="nav-tab-sub">出發前</span></div>`,
].join('');

function st(idx){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.page[data-idx="${idx}"]`).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.nav-tab[data-idx="${idx}"]`).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}
function tc(i){
  const ch=JSON.parse(localStorage.getItem(CK)||'{}');ch[i]=!ch[i];localStorage.setItem(CK,JSON.stringify(ch));
  const el=document.querySelector(`#clg .check-item:nth-child(${i+1})`);if(el)el.classList.toggle('done',!!ch[i]);
}
document.getElementById('navInner').innerHTML=[

].join('');
